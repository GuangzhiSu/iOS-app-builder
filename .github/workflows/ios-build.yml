name: iOS build
run-name: iOS ${{ inputs.distribution || 'testflight' }} · ${{ github.run_number }}
on:
  workflow_dispatch:
    inputs:
      distribution:
        description: Delivery route
        type: choice
        options: [sidestore, testflight]
        default: sidestore
  schedule:
    - cron: "23 9 1 */2 *"
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'schedule' || vars.ENABLE_TESTFLIGHT_RENEWAL == 'true'
    runs-on: macos-15
    timeout-minutes: 35
    environment: ${{ (inputs.distribution == 'testflight' || github.event_name == 'schedule') && 'apple-signing' || 'unsigned-build' }}
    permissions:
      contents: write
    env:
      DISTRIBUTION: ${{ inputs.distribution || 'testflight' }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.allen.pocketbuild' }}
      VERSION: 1.0.${{ github.run_number }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check backend and create icons
        run: |
          node --test test/*.test.mjs
          node prepare.mjs
      - run: brew install xcodegen
      - run: xcodegen generate --spec native/project.yml
      - name: Build unsigned IPA for SideStore
        if: env.DISTRIBUTION == 'sidestore'
        run: |
          set -euo pipefail
          xcodebuild -project native/PocketBuild.xcodeproj -scheme PocketBuild \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/unsigned CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" build
          mkdir -p build/package/Payload
          cp -R build/unsigned/Build/Products/Release-iphoneos/PocketBuild.app build/package/Payload/
          (cd build/package && zip -qr ../PocketBuild-unsigned.ipa Payload)
      - name: Publish unsigned Release and source metadata
        if: env.DISTRIBUTION == 'sidestore'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs");const m={version:process.env.VERSION,buildVersion:process.env.BUILD_NUMBER,bundleIdentifier:process.env.BUNDLE_ID};fs.writeFileSync("build/release-notes.md","Unsigned IPA: download on iPhone, then import and sign in SideStore.\n\n<!-- pocket-build:"+JSON.stringify(m)+" -->\n");'
          gh release create "v$VERSION" build/PocketBuild-unsigned.ipa \
            --title "Pocket Build $VERSION · unsigned" --notes-file build/release-notes.md
      - name: Sign, export, upload to App Store Connect
        if: env.DISTRIBUTION == 'testflight'
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bash native/testflight.sh
